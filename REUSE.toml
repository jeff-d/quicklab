# Vendored third-party Helm charts. These annotations must stay last: where several
# paths match, the final one wins, and these override "aws/**".
# Neither archive bundles a LICENSE file nor declares a license in its
# Chart.yaml, so the upstream license is recorded here instead.

[[annotations]]
path = "aws/modules/cluster/sumo-opentelemetry-demo/charts/opentelemetry-demo-**.tgz"
precedence = "closest"
SPDX-FileCopyrightText = "The OpenTelemetry Authors"
SPDX-License-Identifier = "Apache-2.0"

